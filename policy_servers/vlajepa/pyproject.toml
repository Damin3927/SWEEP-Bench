[project]
name = "bench-vlajepa"
version = "0.1.0"
description = "VLA-JEPA fine-tune and inference server for sweep-bench"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==1.26.4",
    "transformers==4.57.1",
    "accelerate==1.5.2",
    "diffusers==0.35.2",
    "timm==1.0.22",
    "qwen-vl-utils==0.0.14",
    "omegaconf==2.3.0",
    "einops==0.8.1",
    "pillow==12.3.0",
    "pyarrow==21.0.0",
    "pydantic==2.11.9",
    "huggingface-hub==0.35.3",
    "websockets==15.0.1",
    "msgpack==1.2.3",
    "rich==14.2.0",
    "peft==0.17.1",
    "wandb==0.23.0",
]

[tool.uv]
package = false
override-dependencies = ["triton==3.3.1; platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
