[project]
name = "bench-fastwam-server"
version = "0.1.0"
description = "FastWAM inference server for sweep-bench"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==1.26.4",
    "einops==0.8.1",
    "transformers==4.49.0",
    "omegaconf==2.3.0",
    "hydra-core==1.3.8",
    "safetensors==0.5.3",
    "pillow==12.3.0",
    "rich==14.2.0",
    "tqdm==4.66.5",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "gitpython==3.2.1",
    "websockets==16.1.1",
    "msgpack==1.2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
