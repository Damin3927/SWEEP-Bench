CONST:
  EXP_NAME: null
  N_WORKERS: 8

DATASET:
  NAME: null
  PIN_MEMORY: false
  USE_DELTA_ACTION: false
  IMG_SIZE:
  DELTA_TIMESTAMPS:
    observation: [-4, -2, 0]
  REQUIRED_FEATURES:
    - observation.images.opst_cam
    - observation.images.wrist_cam
    - observation.state
    - action

POLICY:
  TYPE: dynamicvla
  CHECKPOINT:
  USE_DELTA_ACTION: false
  N_OBS_STEPS: 3
  CHUNK_SIZE: 20
  N_ACTION_STEPS: 20
  RESIZE_IMGS_WITH_PADDING: [384, 384]
  ATTENTION_MODE: cross_attn
  VLM_MODEL_NAME: HuggingFaceTB/SmolLM2-360M
  NUM_VLM_LAYERS: 16
  NUM_EXPERT_SKIP_LAYERS: 0
  TEMPORAL_FUSION: attn
  FREEZE_VISION_MODEL: false
  FREEZE_CONNECTOR: false
  FREEZE_TEXT_MODEL: false

DIR:
  OUTPUT: ./runs

WANDB:
  ENABLED: true
  PROJECT: sweep-bench
  NAME: dynamicvla-hist-b1-unfrozen
  MODE: online
  RUN_ID: null
  LOG_CODE: false
  SYNC_TENSORBOARD: false

TRAIN:
  N_EPOCHS: 4
  BATCH_SIZE: 32
  GRAD_ACCUM_STEPS: 1
  TEST_FREQ_BATCH: 5000
  CKPT_SAVE_FREQ:
    EPOCH: 1
    BATCH: 0
  OPTIMIZER:
    LR: 1.0e-4
    EPS: 1.0e-8
    WEIGHT_DECAY: 1.0e-10
    BETAS: [0.9, 0.95]
  LR_SCHEDULER:
    NAME: cosine
    N_WARMUP_STEPS: 413
  IMAGE_TRANSFORMS:
    BRIGHTNESS: [0.8, 1.2]
    CONTRAST: [0.8, 1.2]
    SATURATION: [0.5, 1.5]
    HUE: [-0.05, 0.05]
